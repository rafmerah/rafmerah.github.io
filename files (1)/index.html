<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2447">
  <title>Galeri Kenangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR (sticky) -->
  <header class="navbar">
    <div class="navbar__inner">
      <a href="#" class="brand">Galeri Kenangan</a>

      <div class="navbar__tools">
        <input type="search" id="search" class="search" placeholder="Cari foto..." aria-label="Cari foto">

        <!-- Dropdown Kategori -->
        <div class="dropdown" id="dropdown">
          <button class="dropdown__toggle" id="dropdownToggle" aria-haspopup="true" aria-expanded="false">
            <span>Kategori: <strong id="currentCategory">Semua</strong></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="dropdown__menu" id="dropdownMenu" role="menu">
            <li><button role="menuitem" data-category="Semua" class="active">Semua</button></li>
            <li><button role="menuitem" data-category="Foto Grup">Foto Grup</button></li>
            <li><button role="menuitem" data-category="Masa Kampus">Masa Kampus</button></li>
            <li><button role="menuitem" data-category="Liburan">Liburan</button></li>
            <li><button role="menuitem" data-category="Bebas">Bebas</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <!-- HEADER / HERO -->
  <section class="hero">
    <h1>Kumpulan momen yang tak ingin kita lupakan</h1>
    <p>Pilih kategori di menu atas untuk melihat kenangan berdasarkan ceritanya.</p>
  </section>

  <!-- GALERI -->
  <main class="container">
    <p class="result-info" id="resultInfo" aria-live="polite"></p>
    <div class="gallery" id="gallery"></div>
    <p class="empty" id="empty" hidden>Belum ada foto di kategori ini.</p>
  </main>

  <!-- FOOTER / KONTAK -->
  <footer class="footer" id="kontak">
    <div class="footer__inner">
      <div>
        <h2>Kontak</h2>
        <p>Punya foto untuk ditambahkan atau ingin bertukar cerita? Hubungi lewat Instagram.</p>
      </div>
      <a class="instagram" href="https://instagram.com/username_kamu" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        @username_kamu
      </a>
    </div>
    <p class="footer__copy">&copy; <span id="year"></span> Galeri Kenangan</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
